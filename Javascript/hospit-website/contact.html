<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.min.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">Sarvagnya<span
                    class="text-dark">Hospital</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link active btn btn-primary text-dark px-3"
                            href="contact.html">Appointment</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact / Appointment Section -->
    <section class="contact py-5 mt-5">
        <div class="container">
            <div class="row align-items-center g-5">
                <div class="col-lg-6 mb-4 mb-lg-0">
                    <h2 class="fw-bold text-primary mb-4">Book Your Appointment</h2>
                    <form class="p-4 shadow rounded bg-white" id="Appointment">
                        <div class="mb-3">
                            <label class="form-label" for="name">Full Name</label>
                            <input type="text" class="form-control" id="name" name="full name"
                                placeholder="Enter your name">
                            <span class="nameerror  error"></span>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="Enter your email">
                            <span class="Eerror  error"></span>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="number">Phone Number</label>
                            <input type="text" class="form-control" id="number" name="phone number"
                                placeholder="Enter your phone">
                            <span class="Nerror  error">aman</span>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="select">Select Department</label>
                            <select class="form-select" name="select">
                                <option>Cardiology</option>
                                <option>Cosmetology & Leprosy</option>
                                <option>Urology</option>
                                <option>Dental</option>
                                <option>General Surrgen</option>
                                <option>Gastroenterology</option>
                                <option>OBG</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="date">Preferred Date</label>
                            <input type="date" class="form-control" id="date" name="'date">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit</button>
                    </form>
                </div>
                <div class="col-lg-6 text-center">
                    <img src="https://images.stockcake.com/public/8/a/a/8aac237b-5962-4ddc-87d6-1e24ad77a8ba_large/hospital-patient-care-stockcake.jpg"
                        class="img-fluid p-lg-5 mt-4 " alt="Appointment">
                </div>
            </div>
        </div>
    </section>

    <footer class="text-center py-4 bg-primary text-white">
        <p class="mb-0">© 2025  Sarvagnya Hospital | All Rights Reserved</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/script/script.js"></script>
</body>

</html>
